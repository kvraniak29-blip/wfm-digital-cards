name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:github-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  windows-generator-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:github-pages
      - name: Run Windows PowerShell 5.1 generator smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'WFM Test Makler'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Copy-Item -LiteralPath 'assets\brokers\jakub-svec\photo.jpg' -Destination (Join-Path $fixture 'fotografia.jpg') -Force
          @'
          BEGIN:VCARD
          VERSION:3.0
          N:Makler;Test;;;
          FN:Test Makler
          ORG:WFM Reality
          TITLE:Realitný maklér
          TEL;TYPE=CELL,VOICE:+421900111222
          EMAIL;TYPE=INTERNET,WORK:test.makler@example.com
          URL;TYPE=WORK:https://www.wfmreality.sk/
          END:VCARD
          '@ | Set-Content -LiteralPath (Join-Path $fixture 'kontakt.vcf') -Encoding UTF8

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\WFM-Card-Generator.ps1 -ValidationSelfTest -Silent
          if ($LASTEXITCODE -ne 0) { throw "Validation self-test exit code: $LASTEXITCODE" }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\WFM-Card-Generator.ps1 -BrokerFolder $fixture -BrokerLoadSelfTest -Silent
          if ($LASTEXITCODE -ne 0) { throw "Broker load self-test exit code: $LASTEXITCODE" }

          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tools\WFM-Card-Generator.ps1 -BrokerFolder $fixture -GuiLoadSelfTest -Silent
          if ($LASTEXITCODE -ne 0) { throw "GUI load self-test exit code: $LASTEXITCODE" }

          $resultFile = Join-Path $env:RUNNER_TEMP 'wfm-generator-result.json'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\WFM-Card-Generator.ps1 -BrokerFolder $fixture -ResultFile $resultFile -Generate -Silent -SkipImportTests
          if ($LASTEXITCODE -ne 0) { throw "Generator exit code: $LASTEXITCODE" }
          $result = Get-Content -LiteralPath $resultFile -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.status -ne 'PASS') { throw "Generator ResultFile status: $($result.status) $($result.message)" }

          $latestLog = Get-ChildItem -LiteralPath logs -Filter 'WFM-Generator-*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $logText = Get-Content -LiteralPath $latestLog.FullName -Raw -Encoding UTF8
          if ($logText -match 'ArgumentList|There is no Runspace available|property cannot be found|Exception setting "Text"|VybraÅ|prieÄ|GenerovaÅ') { throw "Windows log contains forbidden regression text." }

          foreach ($file in @(
            'data\brokers\test-makler.json',
            'assets\brokers\test-makler\photo.jpg',
            'dist\test-makler\test-makler.vcf',
            'dist\test-makler\qr.png'
          )) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing expected file: $file" }
          }

          $server = Start-Process -FilePath 'node' -ArgumentList @('scripts\serve.mjs') -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            foreach ($i in 1..30) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4173/wfm-digital-cards/' -TimeoutSec 2
                if ($r.StatusCode -eq 200) { break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            foreach ($url in @(
              'http://127.0.0.1:4173/wfm-digital-cards/',
              'http://127.0.0.1:4173/wfm-digital-cards/assets/styles.css',
              'http://127.0.0.1:4173/wfm-digital-cards/assets/branding/logo.png',
              'http://127.0.0.1:4173/wfm-digital-cards/assets/branding/background.png',
              'http://127.0.0.1:4173/wfm-digital-cards/test-makler/'
            )) {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 5
              if ($response.StatusCode -ne 200) { throw "HTTP $($response.StatusCode): $url" }
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

          Remove-Item -LiteralPath 'data\brokers\test-makler.json' -Force
          Remove-Item -LiteralPath 'data\status\test-makler.json' -Force
          Remove-Item -LiteralPath 'assets\brokers\test-makler' -Recurse -Force
          Remove-Item -LiteralPath 'dist\test-makler' -Recurse -Force

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
      - windows-generator-smoke
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
